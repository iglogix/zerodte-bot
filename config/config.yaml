# 0DTE Iron Condor Trading Bot Configuration
# ============================================

bot:
  name: "0dte-iron-condor-bot"
  timezone: "America/New_York"
  # Mode controls order execution:
  #   dry_run  - no API calls at all, fully simulated responses (default)
  #   manual   - live market data + full order generation, but orders NOT submitted
  #   sandbox  - real API calls to TastyTrade cert environment
  #   live     - real API calls to TastyTrade production environment
  mode: "dry_run"

# LLM Configuration
llm:
  primary_model: "anthropic/claude-sonnet-4-5"       # Primary decision maker
  validator_model: "openai/gpt-5.2"                 # Virgin eyes validator
  max_iterations: 10                   # Max tool loop iterations
  timeout_seconds: 30                  # LLM response timeout

# Entry Schedule (Eastern Time)
entry:
  schedule:
    - "09:45"
    - "10:15"
    - "11:15"
    - "12:15"
    - "13:15"
    - "14:15"
    - "15:15"
  stability_candles: 3  # Consecutive 5-min candles at same level (read by LLM from bot_prompt.md)

# Risk Management
risk:
  max_concurrent_trades: 10
  max_daily_risk_percent: 2.0  # 1-2% of account
  max_buying_power_percent: 50.0
  take_profit_threshold: 0.05  # Close short at $0.05

# Position Monitor
monitor:
  poll_interval_seconds: 30   # How often to check open positions
  eod_close_time: "15:55"     # Force-close all positions before this time (ET)

# Stop-Loss Configuration
stop_loss:
  stop_limit_gap: 40   # Points between trigger and limit
  stop_market_gap: 30  # Additional points for backup stop

# Cache TTL (seconds)
cache:
  option_chain_ttl: 60
  quote_ttl: 60
  account_info_ttl: 60

# Notifications
notifications:
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    sender: ""
    recipients: []
  webhook:
    enabled: false
    url: ""

# Database
database:
  trading_db: "0dte_bot.db"
  cache_db: "data/market_cache.db"

# Logging
logging:
  level: "INFO"
  log_dir: "logs"
  daily_rotation: true
