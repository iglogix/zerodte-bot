bot:
  name: "8am-orb-options-bot"
  timezone: "America/New_York"
  mode: "sandbox"         # dry_run | manual | sandbox | live
  symbol: "ES"            # ES futures / 0DTE ES options

strategy:
  orb_window_start: "08:00"
  orb_window_end:   "08:15"
  market_open:      "09:30"
  eod_force_close:  "15:50"
  midline_tolerance_pts: 0.50   # optimized (WF-CV 2026-03-12)
  orb_range_filter:
    min_pts: 5.0                # optimized (WF-CV 2026-03-12)
    max_pts: 30.0               # skip extreme gap/event days
  skip_nfp_fridays: true        # skip first Friday of month (NFP release at 8:30 AM)
  skip_fomc_days: true          # skip FOMC announcement days (statement at 2:00 PM)
  skip_cpi_days: true           # skip CPI release days (8:30 AM, gaps through ORB)

# ORB options logic:
#   LONG  bias (breakout above ORB high) → sell PUT  credit spread below ORB low
#   SHORT bias (breakout below ORB low)  → sell CALL credit spread above ORB high
# Entry trigger: midline retest (same as futures variant)
# Exit: TP at 50% credit | SL at 200% credit | EOD expire/close
options:
  option_root: "EW"               # symbol root for 0DTE options (EW = ES weekly, SPXW = SPX weekly)
  chain_type: "futures"
  spread_width_pts: 5             # distance between short and long strike
  strike_step_pts: 5              # round strikes to nearest N points (SPX uses 5)
  target_short_delta: 0.12        # fallback delta (used when use_straddle_em=false)
  max_short_delta: 0.25           # reject if short strike delta > this
  min_credit_per_spread: 0.05     # lowered — CBBO analysis showed real credits are thin
  tp_pct_of_credit: 0.50          # CBBO-optimized (2026-04-01), was 0.25
  sl_mult_of_credit: 0             # 0=disabled (exit on breach only)
  hold_put_breach: true             # CBBO-optimized: puts survive breaches (100% WR)
  # Straddle-EM strike selection (CBBO-optimized 2026-04-01)
  use_straddle_em: true            # use ATM straddle for expected move (not BS delta)
  spread_mode: "iron_condor"       # "directional" or "iron_condor"
  em_with_trend: 0.50              # with-trend leg: closer, more premium
  em_against_trend: 0.75           # against-trend leg: further, less risk
  width_with_trend: 5              # with-trend spread width
  width_against_trend: 10          # against-trend spread width (wider to collect more credit)
  slippage_per_spread: 0.12        # estimated round-trip slippage deducted from credit (entry+exit)
  atm_filter_width_pts: 150       # only consider strikes within ±N pts of current price
  quantity: 1                      # number of spreads per trade (position sizing)
  contract_multiplier: 50         # dollars per point: ES options = $50, SPX options = $100
  monitor_poll_seconds: 30        # how often to check spread mark price
  assumed_iv: 0.15                # fallback IV if iv_source=fixed or VIX data missing
  pricing_model: "bs"             # "bs" = Black-Scholes | "bachelier" = normal model (better for 0DTE)
  iv_correction_factor: 1.0       # multiplier on IV to correct BS underestimation of 0DTE ITM probability
  iv_skew_table: "models/iv_skew_table.json"  # empirical IV skew correction from BBO data
  # Backtest data sources
  underlying_source: "bars"       # "bars" = use bar prices | "daily_csv" = fetch SPY daily CSV * 10
  iv_source: "vix"                    # "fixed" = use assumed_iv, "vix" = daily VIX9D/VIX, "realized" = from bars

risk:
  max_loss_per_trade_usd: 25000   # max loss per trade total: (width - credit) * multiplier * qty
  max_daily_loss_usd: 25000       # halt if cumulative realized loss exceeds this
  max_buying_power_pct: 50.0

llm:
  enabled: false                # true = use LLM pre-flight (anomaly/regime), false = enter on signal
  advisor_model: "anthropic/claude-haiku-4-5"
  debrief_model: "anthropic/claude-sonnet-4-5"

database:
  trading_db: "orb_options_bot.db"
  cache_db: "data/orb_options_cache.db"

logging:
  level: "INFO"
  log_dir: "logs_8am_options"

market_data:
  dxlink_symbol: "auto"   # "auto" = detect front-month, or explicit like "/ESH26:XCME"

# Market constants for Black-Scholes time-to-expiration calculations
# These vary by product and calendar year
market:
  trading_days_per_year: 252    # NYSE/NASDAQ typical (251-253 depending on year)
  trading_hours_per_day: 6.5    # RTH: 9:30 AM - 4:00 PM ET
  market_close: "16:00"         # ES 0DTE options expire at 4:00 PM ET (RTH close)
  # Note: ES futures trade nearly 24/5 but RTH is 9:30-16:00 ET
  # For SPX options, also 4:00 PM ET (cash-settled at close)

backtest:
  data_dir: "data"                # directory containing spy_daily.csv, vix_daily.csv, vix9d_daily.csv
  data_file: "glbx-mdp3-20210227-20260226.ohlcv-1m.csv"  # ES 1-min bars (unzipped)
  start_date: "2022-04-25"        # 0DTE ES options launched this date
  end_date: "2026-02-26"

# Contract selection logic (handled in options_engine.py):
#   - Multiple ES contracts trade simultaneously during roll periods (H/M/U/Z)
#   - Select highest-volume contract per day (most liquid)
#   - Skip AM expiration days (3rd Friday of contract month, bars end before 10:00 AM)
#   - Use next contract on expiration days
