bot:
  name: "8am-orb-bot"
  timezone: "America/New_York"
  mode: "dry_run"         # dry_run | manual | sandbox | live | backtest
  symbol: "ES"            # ES or MES
  contract_multiplier: 50 # ES=$50/pt, MES=$5/pt
  quantity: 1

strategy:
  orb_window_start: "08:00"
  orb_window_end:   "08:15"
  market_open:      "09:30"
  eod_force_close:  "15:50"
  midline_tolerance_pts: 0.25   # ±0.25 pts around midline triggers entry

exit:
  # 1:4 inverse ratio — quick 5pt TP, wide 20pt SL → ~75% WR (best expectancy per tweaked_rules_8am.md)
  tp_pts: 5
  sl_pts: 20
  # 1:1 ratio alternative — TP=10 SL=10 → ~57% WR
  # tp_pts: 10
  # sl_pts: 10

risk:
  max_daily_loss_pts: 20        # halt if cumulative realized loss exceeds this (matches sl_pts)
  max_buying_power_pct: 50.0

market_data:
  provider: "dxlink"              # dxlink (TastyTrade) for all live data
  dxlink_symbol: "/ESH5:XCME"    # override: auto-resolved from TT instruments API if blank

llm:
  advisor_model: "anthropic/claude-haiku-4-5"
  debrief_model: "anthropic/claude-sonnet-4-5"

database:
  trading_db: "orb_bot.db"
  cache_db: "data/orb_cache.db"

logging:
  level: "INFO"
  log_dir: "logs_8am"

backtest:
  data_file: "GLBX-20260227-7PWD5NKFSF.zip"  # Databento zstd-compressed CSV
  front_month_only: true                      # filter out spread contracts (e.g. ESH1-ESM1)
  start_date: "2024-01-01"
  end_date:   "2024-12-31"
  skip_event_days: false                      # future: skip FOMC/CPI/NFP days
