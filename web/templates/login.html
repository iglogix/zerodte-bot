<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 0DTE Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-gray-100">
    <div class="w-full max-w-sm bg-gray-800 rounded-lg shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-6">0DTE Bot Login</h1>

        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-300 rounded px-4 py-2 mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login">
            <label for="token" class="block text-sm font-medium text-gray-300 mb-2">Token</label>
            <input
                type="password"
                id="token"
                name="token"
                required
                class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-blue-500 mb-4"
                placeholder="Enter your token"
            >
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded px-4 py-2 transition-colors"
            >
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
