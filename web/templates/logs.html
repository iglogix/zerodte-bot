{% extends "base.html" %}

{% block title %}Logs - 0DTE Bot{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Logs</h1>

<!-- Bot Tabs -->
<div class="flex gap-1 mb-4 border-b border-gray-700 pb-2">
    <button class="log-tab px-3 py-1.5 rounded-t text-sm bg-gray-700 text-white" data-bot="all" onclick="selectLogTab('all')">All</button>
    {% for bot in bots %}
    <button class="log-tab px-3 py-1.5 rounded-t text-sm text-gray-400 hover:text-white" data-bot="{{ bot.bot_id }}" onclick="selectLogTab('{{ bot.bot_id }}')">
        {{ bot.name }}
    </button>
    {% endfor %}
</div>

<!-- Controls -->
<div class="flex items-center gap-4 mb-3">
    <label class="flex items-center gap-2 text-sm text-gray-400">
        <input type="checkbox" id="log-autoscroll" checked class="rounded">
        Auto-scroll
    </label>
    <button onclick="document.getElementById('log-container').innerHTML=''" class="text-sm text-gray-400 hover:text-white">Clear</button>
</div>

<!-- Log Container -->
<div id="log-container" class="bg-gray-800 rounded-lg border border-gray-700 p-4 font-mono text-sm h-[60vh] overflow-y-auto whitespace-pre-wrap">
    <span class="text-gray-500">Waiting for log data...</span>
</div>
{% endblock %}

{% block scripts %}
<script>
var activeLogTab = "all";

function selectLogTab(botId) {
    activeLogTab = botId;
    document.querySelectorAll(".log-tab").forEach(function(btn) {
        if (btn.dataset.bot === botId) {
            btn.className = "log-tab px-3 py-1.5 rounded-t text-sm bg-gray-700 text-white";
        } else {
            btn.className = "log-tab px-3 py-1.5 rounded-t text-sm text-gray-400 hover:text-white";
        }
    });

    // Show/hide existing log lines based on selected bot
    var container = document.getElementById("log-container");
    if (!container) return;
    var lines = container.querySelectorAll("[data-bot-id]");
    for (var i = 0; i < lines.length; i++) {
        if (botId === "all" || lines[i].dataset.botId === botId) {
            lines[i].style.display = "";
        } else {
            lines[i].style.display = "none";
        }
    }
}

wsOn("log", function(data) {
    var container = document.getElementById("log-container");
    if (!container) return;

    // Clear placeholder
    var placeholder = container.querySelector(".text-gray-500");
    if (placeholder) container.innerHTML = "";

    var div = document.createElement("div");
    div.textContent = "[" + (data.bot_name || "?") + "] " + (data.line || "");
    div.dataset.botId = data.bot_id || "";
    if (data.level === "error") div.className = "text-red-400";
    else if (data.level === "warning") div.className = "text-yellow-400";
    else div.className = "text-gray-300";

    // Hide if not matching active tab
    if (activeLogTab !== "all" && data.bot_id && data.bot_id !== activeLogTab) {
        div.style.display = "none";
    }

    container.appendChild(div);

    // Limit to 500 lines
    while (container.children.length > 500) container.removeChild(container.firstChild);

    // Auto-scroll
    var autoScroll = document.getElementById("log-autoscroll");
    if (autoScroll && autoScroll.checked) {
        container.scrollTop = container.scrollHeight;
    }
});
</script>
{% endblock %}
