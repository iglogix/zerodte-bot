<!-- src_v2/flux/static/flux.html -->
<!doctype html><html><head><meta charset="utf-8"><title>Flux — SPX IV term structure</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
 body{font:14px system-ui;margin:0;background:#0e1117;color:#e6e6e6}
 header{padding:10px 16px;background:#161b22;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
 label{font-size:12px;color:#9aa4b2} select,button{background:#21262d;color:#e6e6e6;border:1px solid #30363d;border-radius:6px;padding:4px 8px}
 button.active{background:#1f6feb;border-color:#1f6feb}
 #banner{padding:6px 16px;color:#f0b72f;font-size:12px;min-height:18px}
 #chart{height:55vh} table{width:100%;border-collapse:collapse;font-size:13px}
 th,td{padding:6px 10px;border-bottom:1px solid #21262d;text-align:right} th:first-child,td:first-child{text-align:left}
 tr.flag td{color:#3fb950;font-weight:600} h3{margin:12px 16px 4px}
</style></head><body>
<header>
 <strong>Flux — SPX</strong>
 <label>front DTE</label><select id="fd"></select>
 <label>gap</label><select id="gap"></select>
 <label>ref Δ</label><select id="rd"><option value="0.35">0.35 (traded)</option><option value="0.5">0.50 (ATM)</option></select>
 <span><button class="view active" data-v="intraday">1-min</button>
 <button class="view" data-v="5day">5-day</button>
 <button class="view" data-v="20day">20-day</button></span>
 <label>qty</label><input id="qty" type="number" min="1" value="1" style="width:46px">
 <button id="builddc" style="background:#1f6feb;border-color:#1f6feb">Build DC ticket</button>
</header>
<div id="banner"></div>
<div id="chart"></div>
<div id="dcpanel" style="margin:8px 16px"></div>
<h3>Scanner — expiry pairs by ratio drop <button id="scanbtn" style="font-size:11px;padding:2px 8px">↻ scan</button></h3>
<table id="scan"><thead><tr><th>front→back</th><th>gap</th><th>ratio</th><th>prev</th><th>drop</th><th>z</th></tr></thead><tbody></tbody></table>
<script>
const $=s=>document.querySelector(s);
for(const e of [3,5,7,9,12,15]){let o=document.createElement('option');o.value=e;o.text=e;if(e==9)o.selected=true;$('#fd').add(o);}
for(const g of [1,2,3,4]){let o=document.createElement('option');o.value=g;o.text=g;$('#gap').add(o);}
let view='intraday';
// View switches and control changes redraw the CHART ONLY — the scanner (slow) runs only
// on load and on the ↻ scan button, so switching intervals is instant.
document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;refresh();});
['#fd','#gap','#rd'].forEach(s=>$(s).onchange=()=>{$('#dcpanel').innerHTML='';refresh();});
$('#qty').onchange=()=>{$('#dcpanel').innerHTML='';};   // stale ticket → rebuild for new size
$('#scanbtn').onclick=runScan;
$('#builddc').onclick=buildDC;

async function refresh(){
 const fd=$('#fd').value,gap=$('#gap').value,rd=$('#rd').value;
 const url = view==='intraday'
   ? `/api/intraday?front_dte=${fd}&gap=${gap}&ref_delta=${rd}`      // live 1-min (ThetaData)
   : `/api/ratio?front_dte=${fd}&gap=${gap}&ref_delta=${rd}&view=${view}`;  // EOD history
 $('#banner').textContent = view==='intraday' ? 'loading intraday… (first load ~30-50s cold; instant once cached)' : 'loading…';
 const r=await fetch(url).then(r=>r.json());
 const meta=r.meta||{};
 $('#banner').textContent = r.error ? ('error: '+r.error)
   : `${(r.points||[]).length} pts · ${view}` + (meta.session?` · ${meta.session}`:'') + (meta.front_expiry?` · ${meta.front_expiry}/${meta.back_expiry}`:'');
 const x=r.points.map(p=>p.as_of);
 const rr=r.points.map(p=>p.ratio).filter(v=>v!=null);
 // Pin the ratio axis tight to its own data range so intraday moves are pronounced.
 const rmin=rr.length?Math.min(...rr):0.9, rmax=rr.length?Math.max(...rr):1.1;
 const pad=Math.max(0.003,(rmax-rmin)*0.20);
 Plotly.react('chart',[
  {x,y:r.points.map(p=>p.front_iv),name:'front IV',line:{color:'#58a6ff'}},
  {x,y:r.points.map(p=>p.back_iv),name:'back IV',line:{color:'#3fb950'}},
  {x,y:r.points.map(p=>p.ratio),name:'ratio',yaxis:'y2',line:{color:'#f0883e',width:3}},
 ],{paper_bgcolor:'#0e1117',plot_bgcolor:'#0e1117',font:{color:'#e6e6e6'},margin:{t:20,r:70},
    legend:{orientation:'h'},yaxis:{title:'IV',autorange:true},
    yaxis2:{title:'ratio (F/B)',overlaying:'y',side:'right',range:[rmin-pad,rmax+pad],
            zeroline:false,tickformat:'.3f'}});
}

async function runScan(){
 const rd=$('#rd').value;
 $('#scan tbody').innerHTML='<tr><td colspan="6" style="color:#9aa4b2">scanning… (first run cold-fetches expiries, ~30–60s; instant once cached)</td></tr>';
 const sc=await fetch(`/api/scan?ref_delta=${rd}&min_dte=2&max_dte=15&gaps=1,2&by=drop`).then(r=>r.json());
 $('#scan tbody').innerHTML = sc.error
   ? `<tr><td colspan="6" style="color:#f0b72f">scan error: ${sc.error}</td></tr>`
   : ((sc.rows||[]).slice(0,15).map(s=>`<tr class="${s.flag?'flag':''}"><td>${s.front_expiry}→${s.back_expiry}</td><td>${s.gap_td}</td><td>${s.ratio}</td><td>${s.ratio_prev}</td><td>${s.drop}</td><td>${s.zscore}</td></tr>`).join('') || '<tr><td colspan="6" style="color:#9aa4b2">no candidates</td></tr>');
}

function dcQuery(){
 const fd=$('#fd').value,gap=$('#gap').value,rd=$('#rd').value,qty=Math.max(1,+$('#qty').value||1);
 return `front_dte=${fd}&gap=${gap}&target_delta=${rd}&qty=${qty}`;
}

async function buildDC(){
 $('#dcpanel').innerHTML='<span style="color:#9aa4b2">building DC ticket…</span>';
 const r=await fetch(`/api/dc_order?${dcQuery()}`).then(r=>r.json());
 if(r.error){$('#dcpanel').innerHTML=`<span style="color:#f0b72f">DC: ${r.error}</span>`;return;}
 const t=r.ticket, manual=(r.mode==='manual');
 const legs=t.legs.map(l=>`<tr><td>${l.action}</td><td>${l.qty}</td><td>${l.is_call?'C':'P'} ${l.strike} ${l.expiry}</td><td style="color:#9aa4b2">${l.osi}</td></tr>`).join('');
 // Submit + combo are ALWAYS shown; in manual mode the button is disabled (can't fire).
 const btnStyle = manual ? 'background:#30363d;border-color:#30363d;color:#8b949e;cursor:not-allowed'
                         : 'background:#da3633;border-color:#da3633';
 const submitUI = `<div style="margin-top:8px;display:flex;gap:10px;align-items:center">
        <label title="checked = ONE atomic combo order; unchecked = leg-in (buy longs, then sell shorts)"><input type="checkbox" id="combo" checked> combo</label>
        <button id="submitdc" ${manual?'disabled':''} style="${btnStyle}">${manual?'Submit (manual — disabled)':'Submit to '+r.mode}</button>
        <span id="submitmsg" style="color:#9aa4b2;font-size:12px">${manual?'restart <code>flux serve --mode sandbox|live</code> to enable':''}</span>
      </div>`;
 $('#dcpanel').innerHTML=`<div style="border:1px solid #30363d;border-radius:8px;padding:10px;background:#161b22">
   <b>${t.note}</b> — <span style="color:#f0883e">${t.price_effect} limit ${t.price.toFixed(2)}</span> (est $${t.est_cost.toFixed(0)}) · mode: <b>${r.mode}</b>
   <table style="margin-top:6px"><thead><tr><th>action</th><th>qty</th><th>leg</th><th>OSI</th></tr></thead><tbody>${legs}</tbody></table>
   ${submitUI}</div>`;
 if(!manual) $('#submitdc').onclick=()=>submitDC(r.mode,t);
}

async function submitDC(mode,t){
 const exec=$('#combo').checked?'combo':'legin';
 const how=exec==='combo'?'ONE atomic combo order':'4 leg-in orders (buy longs first, then sell shorts)';
 if(!confirm(`Submit ${t.note} to ${mode.toUpperCase()} as ${how}?\nNet ${t.price_effect} limit ${t.price.toFixed(2)} (est $${t.est_cost.toFixed(0)}).`)) return;
 const btn=$('#submitdc'); btn.disabled=true; $('#submitmsg').textContent='submitting…';
 const r=await fetch(`/api/dc_submit?${dcQuery()}&execution=${exec}`,{method:'POST'}).then(r=>r.json());
 btn.disabled=false;
 $('#submitmsg').innerHTML = r.ok
   ? `<span style="color:#3fb950">✓ ${r.detail} — ids: ${r.order_ids.join(', ')}</span>`
   : `<span style="color:#f85149">✗ ${r.detail}</span>`;
}

refresh(); runScan(); setInterval(()=>{if(view==='intraday')refresh();},60000);  // interval = chart only
</script></body></html>
