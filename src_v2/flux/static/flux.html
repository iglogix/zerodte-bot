<!-- src_v2/flux/static/flux.html -->
<!doctype html><html><head><meta charset="utf-8"><title>Flux — SPX IV term structure</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
 body{font:14px system-ui;margin:0;background:#0e1117;color:#e6e6e6}
 header{padding:10px 16px;background:#161b22;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
 label{font-size:12px;color:#9aa4b2} select,button{background:#21262d;color:#e6e6e6;border:1px solid #30363d;border-radius:6px;padding:4px 8px}
 button.active{background:#1f6feb;border-color:#1f6feb}
 #banner{padding:6px 16px;color:#f0b72f;font-size:12px;min-height:18px}
 #chart{height:55vh} table{width:100%;border-collapse:collapse;font-size:13px}
 th,td{padding:6px 10px;border-bottom:1px solid #21262d;text-align:right} th:first-child,td:first-child{text-align:left}
 tr.flag td{color:#3fb950;font-weight:600} h3{margin:12px 16px 4px}
</style></head><body>
<header>
 <strong>Flux — SPX</strong>
 <label>front DTE</label><select id="fd"></select>
 <label>gap</label><select id="gap"></select>
 <label>ref Δ</label><select id="rd"><option value="0.35">0.35 (traded)</option><option value="0.5">0.50 (ATM)</option></select>
 <span><button class="view active" data-v="intraday">1-min</button>
 <button class="view" data-v="5day">5-day</button>
 <button class="view" data-v="20day">20-day</button></span>
 <label>qty</label><input id="qty" type="number" min="1" value="1" style="width:46px">
 <button id="builddc" style="background:#1f6feb;border-color:#1f6feb">Build DC ticket</button>
</header>
<div id="banner"></div>
<div id="chart"></div>
<div id="dcpanel" style="margin:8px 16px"></div>
<h3>Scanner — expiry pairs by ratio drop<span id="scansess" style="color:#9aa4b2;font-weight:normal"></span> <button id="scanbtn" style="font-size:11px;padding:2px 8px">↻ scan</button></h3>
<table id="scan"><thead><tr><th>front→back</th><th>gap</th><th>ratio</th><th>prev</th><th>drop</th><th>z</th></tr></thead><tbody></tbody></table>
<h3>Open double calendars <button id="posbtn" style="font-size:11px;padding:2px 8px">↻ positions</button>
  <label style="margin-left:8px" title="IC wing width W (points). The transform buys front wings at K_put−W / K_call+W. Default 5 = the backtested value (front_dte=9, wing=5).">wing</label><input id="wing" type="number" min="0" value="5" style="width:54px" title="IC wing width in points — backtested at 5"></h3>
<div id="ordpanel" style="margin:8px 16px"></div>
<div id="pospanel" style="margin:8px 16px"></div>
<div id="xfpanel" style="margin:8px 16px"></div>
<script>
const $=s=>document.querySelector(s);
for(const e of [3,5,7,9,12,15]){let o=document.createElement('option');o.value=e;o.text=e;if(e==9)o.selected=true;$('#fd').add(o);}
for(const g of [1,2,3,4]){let o=document.createElement('option');o.value=g;o.text=g;$('#gap').add(o);}
let view='intraday';
// View switches and control changes redraw the CHART ONLY — the scanner (slow) runs only
// on load and on the ↻ scan button, so switching intervals is instant.
document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;refresh();});
['#fd','#gap','#rd'].forEach(s=>$(s).onchange=()=>{$('#dcpanel').innerHTML='';refresh();});
$('#qty').onchange=()=>{$('#dcpanel').innerHTML='';};   // stale ticket → rebuild for new size
$('#scanbtn').onclick=runScan;
$('#builddc').onclick=buildDC;

async function refresh(){
 const fd=$('#fd').value,gap=$('#gap').value,rd=$('#rd').value;
 const url = view==='intraday'
   ? `/api/intraday?front_dte=${fd}&gap=${gap}&ref_delta=${rd}`      // live 1-min (ThetaData)
   : `/api/ratio?front_dte=${fd}&gap=${gap}&ref_delta=${rd}&view=${view}`;  // EOD history
 $('#banner').textContent = view==='intraday' ? 'loading intraday… (first load ~30-50s cold; instant once cached)' : 'loading…';
 const r=await fetch(url).then(r=>r.json());
 const meta=r.meta||{};
 $('#banner').textContent = r.error ? ('error: '+r.error)
   : `${(r.points||[]).length} pts · ${view}` + (meta.session?` · ${meta.session}`:'') + (meta.fell_back?' (last session — market closed/no trades today)':'') + (meta.front_expiry?` · ${meta.front_expiry}/${meta.back_expiry}`:'');
 const x=r.points.map(p=>p.as_of);
 const rr=r.points.map(p=>p.ratio).filter(v=>v!=null);
 // Pin the ratio axis tight to its own data range so intraday moves are pronounced.
 const rmin=rr.length?Math.min(...rr):0.9, rmax=rr.length?Math.max(...rr):1.1;
 const pad=Math.max(0.003,(rmax-rmin)*0.20);
 Plotly.react('chart',[
  {x,y:r.points.map(p=>p.front_iv),name:'front IV',line:{color:'#58a6ff'}},
  {x,y:r.points.map(p=>p.back_iv),name:'back IV',line:{color:'#3fb950'}},
  {x,y:r.points.map(p=>p.ratio),name:'ratio',yaxis:'y2',line:{color:'#f0883e',width:3}},
 ],{paper_bgcolor:'#0e1117',plot_bgcolor:'#0e1117',font:{color:'#e6e6e6'},margin:{t:20,r:70},
    legend:{orientation:'h'},yaxis:{title:'IV',autorange:true},
    yaxis2:{title:'ratio (F/B)',overlaying:'y',side:'right',range:[rmin-pad,rmax+pad],
            zeroline:false,tickformat:'.3f'}});
}

async function runScan(){
 const rd=$('#rd').value;
 $('#scan tbody').innerHTML='<tr><td colspan="6" style="color:#9aa4b2">scanning… (first run cold-fetches expiries, ~30–60s; instant once cached)</td></tr>';
 const sc=await fetch(`/api/scan?ref_delta=${rd}&min_dte=2&max_dte=15&gaps=1,2&by=drop`).then(r=>r.json());
 if(sc.session) $('#scansess').textContent=` — EOD ${sc.session}`;
 $('#scan tbody').innerHTML = sc.error
   ? `<tr><td colspan="6" style="color:#f0b72f">scan error: ${sc.error}</td></tr>`
   : ((sc.rows||[]).slice(0,15).map(s=>`<tr class="${s.flag?'flag':''}"><td>${s.front_expiry}→${s.back_expiry}</td><td>${s.gap_td}</td><td>${s.ratio}</td><td>${s.ratio_prev}</td><td>${s.drop}</td><td>${s.zscore}</td></tr>`).join('') || '<tr><td colspan="6" style="color:#9aa4b2">no candidates</td></tr>');
}

function dcQuery(){
 const fd=$('#fd').value,gap=$('#gap').value,rd=$('#rd').value,qty=Math.max(1,+$('#qty').value||1);
 return `front_dte=${fd}&gap=${gap}&target_delta=${rd}&qty=${qty}`;
}

// Shared ticket+submit renderer for both DC entry and transform. queryFn() rebuilds the
// args; submitUrl is the POST endpoint. Submit + combo always show; disabled in manual.
function renderTicket(box, r, queryFn, submitUrl){
 const t=r.ticket, manual=(r.mode==='manual');
 const legs=t.legs.map(l=>`<tr><td>${l.action}</td><td>${l.qty}</td><td>${l.is_call?'C':'P'} ${l.strike} ${l.expiry}</td><td style="color:#9aa4b2">${(l.osi||'').trim()}</td></tr>`).join('');
 const btnStyle = manual ? 'background:#30363d;border-color:#30363d;color:#8b949e;cursor:not-allowed'
                         : 'background:#da3633;border-color:#da3633';
 const proxyNote = (r.proxy==='spy' && r.proxy_ticket)
   ? `<div style="color:#58a6ff;font-size:11px;margin-top:6px">↳ sandbox submits a <b>SPY proxy</b>: ${r.proxy_ticket.note} — net ${r.proxy_ticket.price_effect} ${r.proxy_ticket.price.toFixed(2)} · ${r.proxy_ticket.legs.map(l=>l.osi.trim()).join(', ')}</div>`
   : '';
 box.innerHTML=`<div style="border:1px solid #30363d;border-radius:8px;padding:10px;background:#161b22">
   <b>${t.note}</b> — <span style="color:#f0883e">${t.price_effect} limit ${t.price.toFixed(2)}</span> (est $${t.est_cost.toFixed(0)}) · mode: <b>${r.mode}</b>
   <table style="margin-top:6px"><thead><tr><th>action</th><th>qty</th><th>leg</th><th>OSI</th></tr></thead><tbody>${legs}</tbody></table>
   <div style="margin-top:8px;display:flex;gap:10px;align-items:center">
     <label title="checked = ONE atomic combo order; unchecked = leg-in (buy longs, then sell shorts)"><input type="checkbox" class="combo" checked> combo</label>
     <button class="submitbtn" ${manual?'disabled':''} style="${btnStyle}">${manual?'Submit (manual — disabled)':'Submit to '+r.mode}</button>
     <span class="submitmsg" style="color:#9aa4b2;font-size:12px">${manual?'restart <code>flux serve --mode sandbox|live</code> to enable':''}</span>
   </div>${proxyNote}</div>`;
 if(!manual) box.querySelector('.submitbtn').onclick=()=>submitTicket(box,r,queryFn,submitUrl);
}

async function submitTicket(box, r, queryFn, submitUrl){
 const t=r.ticket, exec=box.querySelector('.combo').checked?'combo':'legin';
 const how=exec==='combo'?'ONE atomic combo order':`${t.legs.length} leg-in orders (buy longs first, then sell shorts)`;
 if(!confirm(`Submit ${t.note} to ${r.mode.toUpperCase()} as ${how}?\nNet ${t.price_effect} ${t.price.toFixed(2)} (est $${t.est_cost.toFixed(0)}).`)) return;
 const btn=box.querySelector('.submitbtn'); btn.disabled=true; box.querySelector('.submitmsg').textContent='submitting…';
 const res=await fetch(`${submitUrl}?${queryFn()}&execution=${exec}`,{method:'POST'}).then(r=>r.json());
 btn.disabled=false;
 box.querySelector('.submitmsg').innerHTML = res.ok
   ? `<span style="color:#3fb950">✓ ${res.detail} — ids: ${res.order_ids.join(', ')}</span>`
   : `<span style="color:#f85149">✗ ${res.detail}</span>`;
}

async function buildDC(){
 $('#dcpanel').innerHTML='<span style="color:#9aa4b2">building DC ticket…</span>';
 const r=await fetch(`/api/dc_order?${dcQuery()}`).then(r=>r.json());
 if(r.error){$('#dcpanel').innerHTML=`<span style="color:#f0b72f">DC: ${r.error}</span>`;return;}
 renderTicket($('#dcpanel'), r, dcQuery, '/api/dc_submit');
}

// ---- Open double calendars → transform ----
function xfQuery(d){
 const wing=Math.max(0,+$('#wing').value||5);
 return `root=${d.root}&front=${d.front_expiry}&back=${d.back_expiry}&k_put=${d.k_put}&k_call=${d.k_call}&qty=${d.qty}&wing=${wing}`;
}
async function loadOrders(){
 const r=await fetch('/api/orders').then(r=>r.json());
 if(r.error||!(r.orders||[]).length){$('#ordpanel').innerHTML='';return;}
 $('#ordpanel').innerHTML=`<div style="border:1px solid #30363d;border-radius:8px;padding:8px;background:#161b22">
   <b>Working orders</b> <span style="color:#9aa4b2;font-size:11px">(submitted, not yet filled — these are NOT positions)</span>
   ${r.orders.map(o=>`<div style="font-size:12px;margin-top:4px">#${o.id} <span style="color:#f0b72f">${o.status}</span> · ${o.order_type} ${o.price_effect} ${o.price.toFixed(2)} · <span style="color:#9aa4b2">${o.legs.map(l=>l.action.split(' ')[0]+' '+l.symbol).join(', ')}</span></div>`).join('')}</div>`;
}
async function loadPositions(){
 $('#pospanel').innerHTML='<span style="color:#9aa4b2">loading positions…</span>'; $('#xfpanel').innerHTML='';
 loadOrders();
 const r=await fetch('/api/positions').then(r=>r.json());
 if(r.error){$('#pospanel').innerHTML=`<span style="color:#9aa4b2">${r.error}</span>`;return;}
 if(!(r.dcs||[]).length){$('#pospanel').innerHTML='<span style="color:#9aa4b2">no open double calendars detected</span>';return;}
 $('#pospanel').innerHTML=r.dcs.map((d,i)=>`<div style="border:1px solid #30363d;border-radius:8px;padding:8px;margin-bottom:6px;background:#161b22">
   <b>${d.root}</b> ${d.front_expiry} / ${d.back_expiry} — ${d.k_put}P / ${d.k_call}C ×${d.qty}
   <button class="xfbtn" data-i="${i}" style="margin-left:10px">Build transform</button></div>`).join('');
 document.querySelectorAll('.xfbtn').forEach(b=>b.onclick=()=>buildTransform(r.dcs[+b.dataset.i]));
}
async function buildTransform(d){
 $('#xfpanel').innerHTML='<span style="color:#9aa4b2">building transform…</span>';
 const r=await fetch(`/api/transform_order?${xfQuery(d)}`).then(r=>r.json());
 if(r.error){$('#xfpanel').innerHTML=`<span style="color:#f0b72f">transform: ${r.error}</span>`;return;}
 renderTicket($('#xfpanel'), r, ()=>xfQuery(d), '/api/transform_submit');
}
$('#posbtn').onclick=loadPositions;

refresh(); runScan(); loadPositions(); setInterval(()=>{if(view==='intraday')refresh();},60000);  // interval = chart only
</script></body></html>
