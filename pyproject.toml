[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodte-bot"
version = "0.1.0"
description = "Research and trading code for 0DTE SPX/SPY options: strategy-plugin bots, backtests, and findings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ilya Grilikhes"}
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "tastytrade>=10.0.0",
    "litellm>=1.30.0",
    "anthropic>=0.18.0",
    "claude-agent-sdk>=0.2.0",  # subscription-token (CLAUDE_CODE_OAUTH_TOKEN) LLM backend
    "openai>=1.12.0",
    "pyyaml>=6.0.0",
    "torch==2.11.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "flask>=3.0",
    "zstandard>=0.22.0",
    "databento>=0.40.0",
    "psutil>=5.9.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "requests>=2.31",
    "httpx>=0.27",
    "exchange_calendars>=4.5",
    "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[project.scripts]
0dte-bot = "agentic_ic.main:main"

[tool.setuptools.packages.find]
include = ["trading_core*", "agentic_ic*", "zerodte*", "es_8am*", "touch_turn*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_locked", "tests", "tests_web", "tests_v2"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agentic_ic", "trading_core"]
omit = ["tests/*", "tests_locked/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
# scripts/ and tools/ are research one-offs; tests_locked/ is the immutable suite
# (a pre-commit hook rejects any change to it, formatting included).
extend-exclude = ["scripts", "tools", "tests_locked"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",          # line length is advisory
    "N803", "N806",  # option-pricing code keeps the textbook names (S, K, T, IV)
    "E741",          # likewise single-letter maths names
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with compact fixtures, local helper classes and late imports.
"tests*/**" = ["E402", "E702", "E731", "N801", "N802", "N814"]
# Entry points load .env / configure logging before importing the application.
"es_8am/main_options.py" = ["E402"]
"web/app.py" = ["E402"]
"zerodte/backtest/dc_time_machine/simulator.py" = ["E402"]
